modLoader = "javafml"
loaderVersion = "[47,)"
license = "All Rights Reserved"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "交错次元"
credits = "美术: witzig_heidi(鱼)"
description = '''
沉浸飞机：现代化/${mod_name}

为 沉浸式飞机 增加现代化的超频巡导模块。
提供多航线编辑、航点命名、默认飞行高度、单航点飞行高度、HUD 信息显示、燃料与液体燃料剩余显示、自动导航、暂停/继续导航、巡航超频加速，以及盘旋、最快降落、垂直降落等终点策略。
超频巡导模块可安装到沉浸飞机升级槽；玩家可在飞机上打开航线设置，也可手持模块右键编辑同一份模块 NBT 数据。

Chinese Notice
本模组采用 ARR 协议。仅允许作者未修改发布版免费用于个人、非商业、合法的正常游戏使用。
未经作者事先书面许可，禁止二次分发、整合打包、修改后二次发布、商业使用或 AI 训练。
完整条款见随附 LICENSE 与 DISCLAIMER。
以上限制是防止不怀好意的人，如无恶意可以放宽全部限制。

Adds a modern overclocked cruise guidance module for Immersive Aircraft.
Features include multi-route editing, named waypoints, default and per-waypoint flight altitude, HUD information display, item and liquid fuel remaining display, auto navigation, pause/resume navigation, overclock cruise acceleration, and endpoint modes such as holding pattern, fastest landing, and vertical landing.

English Notice
Distributed under ARR.
No redistribution, repacks, modified re-releases, commercial use, or AI training without prior written permission.
See LICENSE and DISCLAIMER for the full terms.
The above restrictions are in place to prevent malicious individuals. If there is no ill intent, all the restrictions can be relaxed.
'''

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[${forge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "immersive_aircraft"
mandatory = true
versionRange = "[1.3.3,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "immersive_aircraft_cruise.mixins.json"
